<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - BiteDash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">BiteDash 🍕</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="cart.html">Cart <span id="cart-count" class="cart-badge">0</span></a>
      <div id="user-nav" style="display:inline-flex; gap:15px;"></div>
    </nav>
  </header>

  <div class="container">
    <div class="form-card">
      <h2 style="margin-bottom: 20px; text-align:center;">Delivery & Checkout</h2>
      <form id="checkout-form">
        <div class="form-group">
          <label>Delivery Address</label>
          <textarea id="deliveryAddress" rows="3" required placeholder="Enter full home address"></textarea>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="checkout-phone" required placeholder="10-digit mobile number">
        </div>
        <div class="form-group">
          <label>Payment Method</label>
          <select id="paymentMethod">
            <option value="Cash on Delivery">Cash on Delivery (COD)</option>
            <option value="UPI / Online">UPI / Online</option>
          </select>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Place Order</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const cart = getCart();
      if (cart.length === 0) {
        alert('Your cart is empty!');
        window.location.href = 'menu.html';
        return;
      }

      const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const body = {
        items: cart,
        totalAmount,
        deliveryAddress: document.getElementById('deliveryAddress').value,
        phone: document.getElementById('checkout-phone').value,
        paymentMethod: document.getElementById('paymentMethod').value
      };

      const res = await fetch('/api/orders/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (data.success) {
        saveCart([]); // Clear Cart
        sessionStorage.setItem('latest_order', JSON.stringify(data.order));
        window.location.href = 'order.html';
      } else {
        alert('Checkout failed: ' + (data.message || data.error));
      }
    });
  </script>
</body>
</html>
