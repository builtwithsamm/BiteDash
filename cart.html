<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - BiteDash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">BiteDash 🍕</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="cart.html">Cart <span id="cart-count" class="cart-badge">0</span></a>
      <div id="user-nav" style="display:inline-flex; gap:15px;"></div>
    </nav>
  </header>

  <div class="container">
    <h2>Your Shopping Cart</h2>
    <br>
    <table class="cart-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="cart-body"></tbody>
    </table>

    <div style="background: white; padding: 20px; border-radius: var(--radius); border: 1px solid var(--border-color); max-width: 350px; margin-left: auto;">
      <h3>Cart Summary</h3>
      <p style="display:flex; justify-content:space-between; margin: 10px 0;">
        <span>Subtotal:</span> <strong id="subtotal">₹0</strong>
      </p>
      <hr>
      <p style="display:flex; justify-content:space-between; margin: 10px 0; font-size: 18px;">
        <span>Total:</span> <strong id="total" style="color:var(--primary);">₹0</strong>
      </p>
      <br>
      <a href="checkout.html" class="btn" style="display:block; text-align:center;">Proceed to Checkout</a>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
